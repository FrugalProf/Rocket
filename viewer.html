<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View in AR</title>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
  :root{
    --ink:#151311;
    --paper:#f6f3ec;
    --muted:#8a8378;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:1.25rem;
  }
  model-viewer{
    width:100%;
    max-width:640px;
    height:60vh;
    min-height:320px;
    background:#eee9dc;
    border-radius:10px;
  }
  .caption{
    max-width:520px;
    text-align:center;
    font-size:0.95rem;
    color:var(--muted);
    margin-top:1rem;
    line-height:1.5;
  }
  .caption strong{color:var(--ink);}
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:0.95rem;
    max-width:400px;
  }
  ::part(default-ar-button){
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const modelUrl = params.get('model');
    const usdzUrl = params.get('usdz');
    const app = document.getElementById('app');

    if(!modelUrl){
      app.innerHTML = '<div class="empty">No model was specified in this link.</div>';
    } else {
      const mv = document.createElement('model-viewer');
      mv.setAttribute('src', modelUrl);
      if(usdzUrl){
        mv.setAttribute('ios-src', usdzUrl);
      }
      mv.setAttribute('camera-controls', '');
      mv.setAttribute('auto-rotate', '');
      mv.setAttribute('shadow-intensity', '1');
      mv.setAttribute('exposure', '1');
      mv.setAttribute('tone-mapping', 'neutral');
      mv.setAttribute('ar', '');
      mv.setAttribute('ar-modes', 'webxr scene-viewer quick-look');

      const arButton = document.createElement('button');
      arButton.slot = 'ar-button';
      arButton.textContent = 'View in your space';
      arButton.style.cssText = 'position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:0.7rem 1.3rem;font-size:0.9rem;font-family:Helvetica Neue,Arial,sans-serif;background:#151311;color:#f6f3ec;border:none;border-radius:999px;cursor:pointer;';

      mv.appendChild(arButton);
      app.appendChild(mv);

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.innerHTML = 'Drag to rotate. Tap <strong>View in your space</strong> to place it in AR using your camera.';
      app.appendChild(caption);

      mv.addEventListener('error', () => {
        app.innerHTML = '<div class="empty">This model couldn\'t be loaded. The link may be broken.</div>';
      });
    }
  </script>
</body>
</html>
